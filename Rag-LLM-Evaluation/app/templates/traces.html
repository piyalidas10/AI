```html
<!DOCTYPE html>
<html>

<head>

    <title>RAG Query Traces</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .trace {
            background: #f8f8f8;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .context {
            background: #eef6ff;
            padding: 15px;
            margin-top: 10px;
            border-radius: 6px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>RAG Query Traces</h1>

        {% for trace in traces %}

        <div class="trace">

            <h3>Question</h3>
            <p>{{trace.question}}</p>

            <h3>Answer</h3>
            <p>{{trace.answer}}</p>

            <h3>Retrieved Context</h3>

            <div class="context">

                <ul>

                    {% for ctx in trace.contexts %}

                    <li>{{ctx}}</li>

                    {% endfor %}

                </ul>

            </div>

        </div>

        {% endfor %}

    </div>

</body>

</html>
```
