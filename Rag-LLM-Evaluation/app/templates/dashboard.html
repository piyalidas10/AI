<!DOCTYPE html>
<html>

<head>

    <title>RAG Evaluation Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card {
            background: #eef6ff;
            padding: 20px;
            border-radius: 10px;
            width: 22%;
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>RAG Evaluation Dashboard</h1>

        <div class="metric">

            <div class="card">
                <h3>Faithfulness</h3>
                <p>{{metrics.faithfulness}}</p>
            </div>

            <div class="card">
                <h3>Answer Relevancy</h3>
                <p>{{metrics.answer_relevancy}}</p>
            </div>

            <div class="card">
                <h3>Context Precision</h3>
                <p>{{metrics.context_precision}}</p>
            </div>

            <div class="card">
                <h3>Context Recall</h3>
                <p>{{metrics.context_recall}}</p>
            </div>

        </div>

        <canvas id="ragChart"></canvas>

    </div>

    <!-- 
    When FastAPI renders the template:

        return templates.TemplateResponse(
            "dashboard.html",
            {
                "request": request,
                "metrics": metrics
            }
        )

        Jinja converts this:

        const ragMetrics = {{ metrics | tojson | safe }};

        into something like:

        const ragMetrics = {
        "faithfulness": 0.91,
        "answer_relevancy": 0.88,
        "context_precision": 0.86,
        "context_recall": 0.90
        };

        Now JavaScript works perfectly.
     -->
    <script>

        const metrics = {{ metrics | tojson | safe }};

        const data = {
            labels: [
                "Faithfulness",
                "Answer Relevancy",
                "Context Precision",
                "Context Recall"
            ],
            datasets: [{
                label: "RAG Metrics",
                data: [
                    metrics.faithfulness || 0,
                    metrics.answer_relevancy || 0,
                    metrics.context_precision || 0,
                    metrics.context_recall || 0
                ],
                borderWidth: 1
            }]
        };

        new Chart(
            document.getElementById('ragChart'),
            {
                type: 'bar',
                data: data
            }
        );

    </script>

</body>

</html>
