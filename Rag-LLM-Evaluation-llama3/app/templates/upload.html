<!DOCTYPE html>
<html>

<head>
    <title>RAG Document Upload</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        input,
        button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .answer {
            margin-top: 20px;
            padding: 20px;
            background: #eef6ff;
            border-radius: 6px;
        }

        .sources {
            margin-top: 15px;
            background: #f8f8f8;
            padding: 15px;
            border-radius: 6px;
        }
    </style>

</head>

<body>

    <nav style="background:#1f2937;padding:15px">

    <a href="/" style="color:white;margin-right:20px">Upload</a>

    <a href="/dashboard" style="color:white;margin-right:20px">
        RAG Metrics Dashboard
    </a>

    <a href="/traces" style="color:white">
        Query Traces
    </a>

</nav>

    <div class="container">

        <h1>RAG Document Assistant</h1>

        <h3>Upload Document</h3>

        <form action="/upload" method="post" enctype="multipart/form-data">

            <input type="file" name="file" required>

            <input type="text" name="category" placeholder="Document category">

            <button type="submit">Upload</button>

        </form>


        <h3>Ask Question</h3>

        <form action="/ask-ui" method="post">

            <input type="text" name="question" placeholder="Enter your question" required>

            <button type="submit">Ask</button>

        </form>


        {% if answer %}

        <div class="answer">

            <h3>Answer</h3>

            <p>{{answer}}</p>

        </div>

        {% endif %}


        {% if sources %}

        <div class="sources">

            <h3>Sources</h3>

            <ul>

                {% for s in sources %}

                <li>{{s.file}} | Page: {{s.page}} | Category: {{s.category}}</li>

                {% endfor %}

            </ul>

        </div>

        {% endif %}

    </div>

</body>

</html>
